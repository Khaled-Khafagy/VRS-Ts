permissions:
  contents: write
  pull-requests: write
  checks: write
  pages: write      # Added for Pages deployment
  id-token: write   # Added for secure deployment

name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        TEST_EMAIL: ${{ secrets.TEST_EMAIL }}
        TEST_PASSWORD: ${{ secrets.TEST_PASSWORD }}
        INVALID_LOGIN_EMAIL: ${{ secrets.INVALID_LOGIN_EMAIL }}
        INVALID_LOGIN_PASSWORD: ${{ secrets.INVALID_LOGIN_PASSWORD }}
        BASE_URL: ${{ secrets.BASE_URL }}
        LOGIN_URL: ${{ secrets.LOGIN_URL }}
        OUR_DESTINATIONS_URL: ${{ secrets.OUR_DESTINATIONS_URL }}
        PAYMENT_CARD_NUMBER: ${{ secrets.PAYMENT_CARD_NUMBER }}
        PAYMENT_EXPIRY: ${{ secrets.PAYMENT_EXPIRY }}
        PAYMENT_CVC: ${{ secrets.PAYMENT_CVC }}
        PAYMENT_NAME: ${{ secrets.PAYMENT_NAME }}
        BILLING_COUNTRY: ${{ secrets.BILLING_COUNTRY }}
        BILLING_STATE: ${{ secrets.BILLING_STATE }}
        BILLING_CITY: ${{ secrets.BILLING_CITY }}
        BILLING_ADDRESS_LINE1: ${{ secrets.BILLING_ADDRESS_LINE1 }}
        BILLING_ADDRESS_LINE2: ${{ secrets.BILLING_ADDRESS_LINE2 }}
        BILLING_ZIP_CODE: ${{ secrets.BILLING_ZIP_CODE }}
        Exiting_Guest_User_Firt_Name: ${{ secrets.Exiting_Guest_User_Firt_Name }}
        Exiting_Guest_User_Last_Name: ${{ secrets.Exiting_Guest_User_Last_Name }}
    - name: Load Allure history
      uses: actions/checkout@v4
      if: always()
      continue-on-error: true
      with:
        ref: gh-pages
        path: gh-pages-dir

    # NEW STEP: Install Allure CLI manually to fix "Command not found"
    - name: Install Allure CLI
      if: always()
      run: npm install -g allure-commandline --save-dev

    - name: Generate Allure Report
      if: always()
      run: |
        mkdir -p allure-results/history
        if [ -d "gh-pages-dir/history" ]; then
          cp -r gh-pages-dir/history/* allure-results/history/
        fi
        allure generate allure-results --clean -o allure-report

    - name: Deploy to GitHub Pages
      if: always()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages

    - name: Post Comment to PR
      if: always() && github.event_name == 'pull_request'
      uses: mshick/add-pr-comment@v2
      with:
        message: |
          ### 📊 Test Results Summary
          **Status:** ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}
          **Live Report:** [Click here to view the Allure Report](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/)